name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Chọn Xcode mới nhất
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Kiểm tra bộ rút gọn câu
        run: |
          swiftc SignTask/SignGrammarShortener.swift Tests/main.swift -o shortener-test
          ./shortener-test

      - name: Tạo project Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build cho iPhone Simulator
        run: |
          xcodebuild build \
            -project SignTask.xcodeproj \
            -scheme SignTask \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Đóng gói app Simulator (để chạy trên trình duyệt qua Appetize.io)
        run: |
          ditto -c -k --norsrc --keepParent \
            build/Build/Products/Debug-iphonesimulator/SignTask.app SignTask-appetize.zip
          unzip -l SignTask-appetize.zip | head -5

      # archive: false → tải về đúng file zip này, upload thẳng lên Appetize không cần giải nén
      - name: Tải lên mục Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: SignTask-appetize.zip
          archive: false
          retention-days: 30
