# Tạo SignTask.xcodeproj bằng XcodeGen:  brew install xcodegen && xcodegen
name: SignTask
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  SignTask:
    type: application
    platform: iOS
    sources: [SignTask]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SignTask
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: SignTask
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Ghi âm chỉ dẫn"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Chuyển chỉ dẫn bằng giọng nói thành văn bản"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""   # chưa có icon app
        CODE_SIGN_STYLE: Automatic
